# Backend stack: api + worker (same image) + postgres + redis.
# Configure in .env (copy .env.example). Only the API port is published,
# on 127.0.0.1 by default.
name: coding-submission-tracker

x-app: &app
  image: coding-submission-tracker:local
  environment:
    # Service names resolve on the internal network.
    DATABASE_URL: postgres://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-tracker}
    REDIS_URL: redis://redis:6379
    PORT: "8787"
    HOST: 0.0.0.0
    LOG_LEVEL: ${LOG_LEVEL:-info}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env}
    APP_ENCRYPTION_KEY_ID: ${APP_ENCRYPTION_KEY_ID:-k1}
    APP_ENCRYPTION_OLD_KEYS: ${APP_ENCRYPTION_OLD_KEYS:-}
    EXTENSION_ORIGIN: ${EXTENSION_ORIGIN:?set EXTENSION_ORIGIN in .env}
    UPLOAD_MAX_ATTEMPTS: ${UPLOAD_MAX_ATTEMPTS:-6}
    PURGE_SOURCE_ON_SUCCESS: ${PURGE_SOURCE_ON_SUCCESS:-true}
    RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-120000}
  networks: [internal]
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

  api:
    <<: *app
    build: .
    command: ["node", "dist/cli.js", "api"]
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/readyz"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6

  worker:
    <<: *app
    command: ["node", "dist/cli.js", "worker"]
    # The worker needs migrations; the api applies them before it is healthy.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    stop_grace_period: 60s

networks:
  internal: {}

volumes:
  pgdata: {}
  redisdata: {}
